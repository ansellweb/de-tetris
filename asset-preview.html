<!doctype html><html><head><meta charset="utf-8"><title>DE-TETRIS Asset Preview</title>
<style>

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:18px}

.card img{width:96px;height:96px;object-fit:contain}.card span{display:block;margin-top:8px}
</style></head><body><main>
<img class="logo" src="assets/design/de-tetris-logo.svg">
<h1>Asset preview</h1><div class="grid">
